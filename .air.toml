# Rebuilds and restarts the Go server when Go or templ output changes,
# or when a fresh messenger build lands in public/widget (its manifest
# changes). The browser app reloads itself through the Vite dev server.
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/dimmi ./cmd/dimmi"
  entrypoint = ["./tmp/dimmi", "serve"]
  include_ext = ["go", "sql", "json", "yaml"]
  exclude_dir = ["node_modules", "public/build", "public/brand", "resources/js", "storage", "tmp", "specs", "research", "docs", "bin", ".claude", ".cursor"]
  exclude_regex = ["_test\\.go$"]
  delay = 200
  kill_delay = "2s"
  send_interrupt = true
  stop_on_error = true

[log]
  main_only = true
