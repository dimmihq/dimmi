# /var/lib/rancher/k3s/server/manifests/traefik-config.yaml. The Hetzner load
# balancer speaks the PROXY protocol, so Traefik reads the real client address
# from it. Only private addresses are trusted to send that header.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    ports:
      web:
        proxyProtocol:
          trustedIPs: ["10.0.0.0/8"]
        forwardedHeaders:
          trustedIPs: ["10.0.0.0/8"]
      websecure:
        proxyProtocol:
          trustedIPs: ["10.0.0.0/8"]
        forwardedHeaders:
          trustedIPs: ["10.0.0.0/8"]
