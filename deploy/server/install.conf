# Hetzner installimage settings for the server: both NVMe drives mirrored,
# a small plain /boot and everything else in one encrypted volume. There is
# no swap. install.sh adds the CRYPTPASSWORD line on the server, so the
# passphrase is never written here.
DRIVE1 /dev/nvme0n1
DRIVE2 /dev/nvme1n1
SWRAID 1
SWRAIDLEVEL 1
HOSTNAME dimmi-1
USE_KERNEL_MODE_SETTING yes
PART /boot ext3 1024M
PART / ext4 all crypt
IMAGE /root/.oldroot/nfs/images/Ubuntu-resolute-latest-amd64-base.tar.zst
