# The staging load balancer forwards ports 80 and 443 to these node ports.
#
# This edge also serves the error tracker's host (errors.caddy), which every
# environment shares, so it goes live with main's deploys.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dimmi-staging
resources:
  - ../../base/edge
configMapGenerator:
  - name: caddy
    behavior: merge
    files:
      - errors.caddy
  - name: edge
    literals:
      - HOST=staging.trydimmi.com
      - FILES_HOST=files.staging.trydimmi.com
      - ACME_EMAIL=ops@trydimmi.com
      - SITE_ROBOTS=noindex
patches:
  - target:
      kind: Service
      name: edge
    patch: |
      - op: add
        path: /spec/ports/0/nodePort
        value: 30080
      - op: add
        path: /spec/ports/1/nodePort
        value: 30443
