# The marketing site and its docs: prerendered static files behind nginx.
# The edge sends the site's paths on the environment's host here and the
# rest to the app. New pods pass their check before old ones stop.
apiVersion: v1
kind: Service
metadata:
  name: site
spec:
  selector:
    app.kubernetes.io/name: dimmi
    app.kubernetes.io/component: site
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: site
spec:
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: dimmi
      app.kubernetes.io/component: site
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dimmi
        app.kubernetes.io/component: site
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
      containers:
        - name: site
          image: dimmi-site
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 128Mi
