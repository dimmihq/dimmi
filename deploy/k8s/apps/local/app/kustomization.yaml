apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dimmi-local
resources:
  - ../../base/app
images:
  - name: dimmi
    newName: dimmi
    newTag: local
patches:
  - target:
      kind: Service
      name: web
    patch: |
      - op: add
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30080
