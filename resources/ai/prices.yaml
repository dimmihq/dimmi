version: "2026-11-06"
currency: USD
# prices per 1M tokens in USD; cached_input is a cache read,
# cache_write the short-lived write rate. Long-context premiums
# (anthropic haiku >100k, openai >272k) are handled per call later.
models:
  - provider: anthropic
    match: exact
    model: claude-sonnet-5-5
    input_per_mtok: "2.00"
    cached_input_per_mtok: "0.10"
    cache_write_per_mtok: "2.50"
    output_per_mtok: "10.00"
    roles: [answer]
  - provider: anthropic
    match: exact
    model: claude-opus-5-5
    input_per_mtok: "4.00"
    cached_input_per_mtok: "0.20"
    cache_write_per_mtok: "5.00"
    output_per_mtok: "20.00"
    roles: [answer]
  - provider: anthropic
    match: exact
    model: claude-haiku-5-5
    input_per_mtok: "0.10"
    cached_input_per_mtok: "0.01"
    cache_write_per_mtok: "0.125"
    output_per_mtok: "0.50"
    roles: [classifier]
  - provider: openai
    match: exact
    model: gpt-6.1-sol
    input_per_mtok: "2.00"
    cached_input_per_mtok: "0.10"
    cache_write_per_mtok: "2.50"
