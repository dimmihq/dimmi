# The marketing site at /, its docs at /docs. Both are prerendered: every
# page is a directory with an index.html.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  # Redirects stay relative, so they never name the container's port.
  absolute_redirect off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/markdown text/plain;

  location / {
    try_files $uri $uri/index.html $uri.html =404;
  }

  location = /docs {
    return 301 /docs/;
  }

  location /docs/ {
    try_files $uri $uri/index.html $uri.html =404;
    error_page 404 /docs/404.html;
  }

  # Root and docs llms.txt / llms-full.txt, plus each docs page's Markdown (path + ".md").
  location ~ ^/docs/.*\.md$ {
    default_type text/markdown;
    charset utf-8;
    charset_types text/markdown;
  }

  location ~ ^/(docs/)?llms(-full)?\.txt$ {
    default_type text/plain;
    charset utf-8;
  }

  # Hashed build assets never change: the site's and the docs'.
  location ~ ^/(assets|docs/_astro)/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /healthz {
    access_log off;
    return 200 "ok";
  }
}
