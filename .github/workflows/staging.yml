# Releases every commit main's checks passed to staging: build the image,
# push it to GHCR under the commit's sha, release it to the server and check
# it from the outside.
#
# Staging environment secrets: KUBECONFIG, a kubeconfig for the namespace's
# deployer account, and GATE_CI_KEY, the key the smoke test passes the gate
# with.

name: staging

on:
  workflow_run:
    workflows: [main]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-staging
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment:
      name: staging
      url: https://staging.trydimmi.com
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/dimmihq/dimmi:${{ env.SHA }}
          build-args: REVISION=${{ env.SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Point kubectl at the server
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p ~/.kube
          printf '%s' "$KUBECONFIG_DATA" > ~/.kube/config
          chmod 600 ~/.kube/config
      - name: Release
        run: deploy/k8s/scripts/release.sh staging "$SHA"
      - name: Smoke test
        run: deploy/release/smoke.sh https://staging.trydimmi.com expect-gate
        env:
          EXPECT_RELEASE: ${{ env.SHA }}
          GATE_KEY: ${{ secrets.GATE_CI_KEY }}
