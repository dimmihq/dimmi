# Releases a commit to staging: main.yml calls this on every push to main
# as soon as its run built the image and pushed it to GHCR under the
# commit's sha, without waiting for the checks. This releases it to the
# server and checks it from the outside. Run by hand, it releases the
# branch's newest commit.
#
# Staging environment secrets: KUBECONFIG, a kubeconfig for the namespace's
# deployer account, and GATE_CI_KEY, the key the smoke test passes the gate
# with.

name: staging

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  release:
    concurrency:
      group: release-staging
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: staging
      url: https://staging.trydimmi.com
    env:
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
          filter: blob:none
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Look for the image main's run pushed
        id: image
        run: |
          if docker buildx imagetools inspect "ghcr.io/dimmihq/dimmi:$SHA" > /dev/null; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi
      # Only when main's run pushed none, such as a manual release of a
      # commit main never built.
      - if: steps.image.outputs.pushed != 'true'
        uses: docker/setup-buildx-action@v3
      - if: steps.image.outputs.pushed != 'true'
        name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/dimmihq/dimmi:${{ env.SHA }}
          build-args: REVISION=${{ env.SHA }}
      - name: Point kubectl at the server
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p ~/.kube
          printf '%s' "$KUBECONFIG_DATA" > ~/.kube/config
          chmod 600 ~/.kube/config
      - name: Remember the running release
        run: |
          image="$(kubectl -n dimmi-staging get deployment web \
            -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)"
          previous="${image##*:}"
          if [[ "$previous" =~ ^[0-9a-f]{40}$ && "$previous" != "$SHA" ]]; then
            echo "PREVIOUS=$previous" >> "$GITHUB_ENV"
          fi
      # Runs of commits pushed close together can pass out of order, so a
      # commit staging already runs a later one of is not released over it.
      - name: Skip a commit older than the running release
        if: github.event_name == 'push' && env.PREVIOUS != ''
        run: |
          if git merge-base --is-ancestor "$SHA" "$PREVIOUS" 2>/dev/null; then
            echo "::notice::staging already runs $PREVIOUS, which comes after $SHA"
            echo "OUTDATED=true" >> "$GITHUB_ENV"
          fi
      - name: Release
        if: env.OUTDATED != 'true'
        run: deploy/k8s/scripts/release.sh staging "$SHA"
      - name: Smoke test
        if: env.OUTDATED != 'true'
        run: deploy/release/smoke.sh https://staging.trydimmi.com expect-gate
        env:
          EXPECT_RELEASE: ${{ env.SHA }}
          GATE_KEY: ${{ secrets.GATE_CI_KEY }}
      - name: Roll back to the previous release
        if: failure() && env.PREVIOUS != ''
        run: deploy/k8s/scripts/rollback.sh staging "$PREVIOUS"
