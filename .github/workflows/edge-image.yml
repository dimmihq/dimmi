# Builds the edge image, Caddy with the edge's modules, and pushes it to
# GHCR under the tag the base edge names
# (deploy/k8s/apps/base/edge/kustomization.yaml). A tag that exists is
# never built again, so a change to the image needs a new tag there.

name: edge image

on:
  push:
    branches: [main]
    paths:
      - deploy/k8s/edge/**
      - deploy/k8s/apps/base/edge/kustomization.yaml
      - .github/workflows/edge-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Read the tag the base edge names
        run: |
          tag="$(sed -n 's/^ *newTag: \(edge-[0-9A-Za-z.-]*\)$/\1/p' deploy/k8s/apps/base/edge/kustomization.yaml)"
          [ -n "$tag" ] || { echo "the base edge names no edge tag"; exit 1; }
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Look for the image
        id: image
        run: |
          if docker buildx imagetools inspect "ghcr.io/dimmihq/dimmi:$TAG" > /dev/null 2>&1; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.image.outputs.pushed != 'true'
        uses: docker/setup-buildx-action@v3
      - if: steps.image.outputs.pushed != 'true'
        name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: deploy/k8s/edge
          push: true
          tags: ghcr.io/dimmihq/dimmi:${{ env.TAG }}
