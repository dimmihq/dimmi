# Releases a version to production: release.yml calls this once it has
# published a version that is not a prerelease, and it can be run by hand
# for a version already published. Production runs the images main built
# for the version's commit (the commit's sha, and site-<sha>), the same ones
# staging ran, so nothing is built here.
#
# A commit is released only when every check of main's run for it passed.
# A release that fails its smoke test is rolled back to the one before it.
#
# Production environment secret: KUBECONFIG, a kubeconfig for the
# namespace's deployer account.

name: production

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: The published version to release to production, such as v0.1.0.
        required: true

permissions:
  contents: read
  packages: read
  actions: read

jobs:
  release:
    concurrency:
      group: release-production
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
      url: https://trydimmi.com
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.version }}
          fetch-depth: 0
          filter: blob:none
      - name: Check the version and find its commit
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a version production takes: $VERSION"; exit 1; }
          echo "SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Require every check of main's run for the commit
        run: |
          conclusion="$(gh run list -R "$GITHUB_REPOSITORY" --workflow main.yml --commit "$SHA" --event push \
            --json conclusion --jq '.[0].conclusion // ""')"
          if [ "$conclusion" != "success" ]; then
            echo "main's run for $SHA ended as '${conclusion:-none}'; production takes only a commit whose checks passed"
            exit 1
          fi
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Look for the images main's run pushed
        run: |
          for tag in "$SHA" "site-$SHA"; do
            docker buildx imagetools inspect "ghcr.io/dimmihq/dimmi:$tag" > /dev/null ||
              { echo "ghcr.io/dimmihq/dimmi:$tag is missing"; exit 1; }
          done
      - name: Point kubectl at the server
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p ~/.kube
          printf '%s' "$KUBECONFIG_DATA" > ~/.kube/config
          chmod 600 ~/.kube/config
      - name: Remember the running release
        run: |
          image="$(kubectl -n dimmi-production get deployment web \
            -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)"
          previous="${image##*:}"
          if [[ "$previous" =~ ^[0-9a-f]{40}$ && "$previous" != "$SHA" ]]; then
            echo "PREVIOUS=$previous" >> "$GITHUB_ENV"
          fi
          curl --silent --fail --max-time 15 https://trydimmi.com/sitemap.xml \
            -o "$RUNNER_TEMP/previous-sitemap.xml" || true
      - name: Release
        run: deploy/k8s/scripts/release.sh production "$SHA"
      # A new edge orders its certificates when it starts, and the first
      # order can fail while the load balancer still learns the edge is up;
      # the edge then orders again a minute later. So the host is given a
      # few minutes to answer over verified TLS before it is checked.
      - name: Wait for the edge's certificate
        run: |
          for _ in $(seq 1 30); do
            curl --silent --output /dev/null --max-time 10 https://trydimmi.com/up && exit 0
            sleep 10
          done
          echo "https://trydimmi.com/up never answered over verified TLS"; exit 1
      - name: Smoke test
        run: deploy/release/smoke.sh https://trydimmi.com
        env:
          EXPECT_RELEASE: ${{ env.SHA }}
      - name: Roll back to the previous release
        if: failure() && env.PREVIOUS != ''
        run: deploy/k8s/scripts/rollback.sh production "$PREVIOUS"
      - name: Set up Node for IndexNow
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Notify IndexNow
        continue-on-error: true
        run: |
          args=(--sitemap https://trydimmi.com/sitemap.xml)
          if [ -s "$RUNNER_TEMP/previous-sitemap.xml" ]; then
            args+=(--previous-sitemap "$RUNNER_TEMP/previous-sitemap.xml")
          fi
          node scripts/indexnow.ts "${args[@]}"
