# Releases an image staging already ran to production. Started by hand; the
# production environment's required reviewers approve before it runs.
#
# Production environment variables: AWS_REGION, AWS_ACCOUNT_ID,
# AWS_DEPLOY_ROLE_ARN, and SOURCE_AWS_REGION (staging's Region).

name: production

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit whose image staging ran
        required: true

concurrency:
  group: release-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
      url: https://trydimmi.com
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Copy the image from staging
        env:
          REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr
          SOURCE: ${{ vars.SOURCE_AWS_REGION }}
          SHA: ${{ inputs.sha }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "sha must be a full commit sha"; exit 1; }
          for region in "$SOURCE" "$AWS_REGION"; do
            aws ecr get-login-password --region "$region" |
              docker login --username AWS --password-stdin "$REGISTRY.$region.amazonaws.com"
          done
          docker buildx imagetools create \
            --tag "$REGISTRY.$AWS_REGION.amazonaws.com/dimmi-production:$SHA" \
            "$REGISTRY.$SOURCE.amazonaws.com/dimmi-staging:$SHA"
      - name: Release
        run: deploy/release/release.sh "$SHA"
        env:
          ENVIRONMENT: production
          SHA: ${{ inputs.sha }}
      - name: Smoke test
        run: deploy/release/smoke.sh https://trydimmi.com
