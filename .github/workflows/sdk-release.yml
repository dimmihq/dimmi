# Releases the SDKs from sdk/.changeset. A push to main with pending
# changesets opens or updates the "Version packages" pull request; merging
# it bumps the versions, and the next run publishes every SDK whose version
# is not released yet. Publishing waits for an approval on the protected
# sdk-release environment and uses only that environment's secrets.
#
#   npm         @dimmi/* with provenance (NPM_TOKEN, or npm trusted publishing)
#   Go          sdk/go split into the read-only mirror dimmihq/dimmi-go
#               (module github.com/dimmihq/dimmi-go), tagged vX.Y.Z
#   PHP         sdk/php and sdk/laravel split into read-only mirrors
#               (dimmihq/dimmi-php, dimmihq/dimmi-laravel), tagged vX.Y.Z,
#               which Packagist follows (SPLIT_TOKEN)
#   Python      PyPI through trusted publishing
#
# Generated code is never committed here: every SDK is generated from
# tests/contracts/api_v1.openapi.json before it is built, split or
# published, so only the mirrors and the packages carry it.

name: sdk-release

on:
  push:
    branches: [main]
    paths:
      - "sdk/**"
      - "tests/contracts/api_v1.openapi.json"
      - "tests/contracts/webhooks_v1.json"
  workflow_dispatch:

concurrency:
  group: sdk-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Opens or updates the "Version packages" pull request while changesets
  # are pending; reports whether any are.
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pending: ${{ steps.changesets.outputs.hasChangesets }}
      unreleased: ${{ steps.unreleased.outputs.any }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - id: changesets
        uses: changesets/action@v1
        with:
          cwd: sdk
          version: pnpm --dir .. sdk:version
          title: Version packages
          commit: Version packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Anything to publish: an npm version the registry lacks, or another
      # SDK's version without its sdk/<name>/vX.Y.Z tag.
      - id: unreleased
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          any=false
          for manifest in sdk/*/package.json; do
            name=$(node -p "require('./$manifest').name")
            version=$(node -p "require('./$manifest').version")
            if [ "$(node -p "require('./$manifest').private === true")" = "true" ]; then
              sdk=$(basename "$(dirname "$manifest")")
              git rev-parse -q --verify "refs/tags/sdk/$sdk/v$version" >/dev/null || any=true
            elif ! npm view "$name@$version" version >/dev/null 2>&1; then
              any=true
            fi
          done
          echo "any=$any" >> "$GITHUB_OUTPUT"

  # Publishes every SDK version not released yet, after approval.
  publish:
    needs: version
    if: needs.version.outputs.pending == 'false' && needs.version.outputs.unreleased == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: sdk-release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - uses: astral-sh/setup-uv@v6
      - run: pnpm install --frozen-lockfile
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer
      - name: Generate, build, test and check every SDK
        run: |
          node scripts/sdk-generate.ts --check
          node scripts/sdk-compat.ts
      - name: Read the versions
        id: versions
        run: node scripts/sdk-versions.ts --print >> "$GITHUB_OUTPUT"
      - name: Find the unreleased SDKs
        id: unreleased
        run: |
          for sdk in go php laravel python; do
            version=$(node scripts/sdk-versions.ts --print | sed -n "s/^$sdk=//p")
            if [ -n "$version" ] && ! git rev-parse -q --verify "refs/tags/sdk/$sdk/v$version" >/dev/null; then
              echo "$sdk=true" >> "$GITHUB_OUTPUT"
            fi
          done

      - name: Publish to npm
        working-directory: sdk
        run: pnpm dlx @changesets/cli@3.0.3 publish
        env:
          NPM_CONFIG_PROVENANCE: "true"
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Tag the Go, PHP, Laravel and Python releases in this repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for sdk in go php laravel python; do
            version=$(node scripts/sdk-versions.ts --print | sed -n "s/^$sdk=//p")
            if [ -n "$version" ] && ! git rev-parse -q --verify "refs/tags/sdk/$sdk/v$version" >/dev/null; then
              git tag -a "sdk/$sdk/v$version" -m "$sdk SDK v$version"
            fi
          done
          git push origin --tags

      # The mirrors carry the generated code and none of the monorepo's
      # plumbing: no version records, no path repositories, no lock files.
      - name: Prepare the mirrors
        run: |
          rm -f sdk/go/package.json sdk/php/package.json sdk/laravel/package.json
          rm -rf sdk/php/vendor sdk/laravel/vendor sdk/laravel/composer.lock sdk/php/composer.lock
          node -e '
            const fs = require("fs"), f = "sdk/laravel/composer.json", j = JSON.parse(fs.readFileSync(f));
            j.repositories = (j.repositories || []).filter((r) => r.type !== "path");
            if (j.repositories.length === 0) delete j.repositories;
            fs.writeFileSync(f, JSON.stringify(j, null, 4) + "\n");'

      - name: Split the Go SDK to its mirror
        if: steps.unreleased.outputs.go == 'true'
        uses: symplify/monorepo-split-github-action@v2.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.SPLIT_TOKEN }}
        with:
          package_directory: sdk/go
          repository_organization: dimmihq
          repository_name: dimmi-go
          branch: main
          tag: v${{ steps.versions.outputs.go }}
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com

      - name: Split the PHP SDK to its mirror
        if: steps.unreleased.outputs.php == 'true'
        uses: symplify/monorepo-split-github-action@v2.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.SPLIT_TOKEN }}
        with:
          package_directory: sdk/php
          repository_organization: dimmihq
          repository_name: dimmi-php
          branch: main
          tag: v${{ steps.versions.outputs.php }}
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com

      - name: Split the Laravel SDK to its mirror
        if: steps.unreleased.outputs.laravel == 'true'
        uses: symplify/monorepo-split-github-action@v2.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.SPLIT_TOKEN }}
        with:
          package_directory: sdk/laravel
          repository_organization: dimmihq
          repository_name: dimmi-laravel
          branch: main
          tag: v${{ steps.versions.outputs.laravel }}
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com

      - name: Build the Python SDK
        if: steps.unreleased.outputs.python == 'true'
        working-directory: sdk/python
        run: uv build --out-dir dist

      - name: Publish the Python SDK to PyPI
        if: steps.unreleased.outputs.python == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist
