# Every push to main and every pull request: check everything, and build
# the release image alongside the checks. A push to main releases the image
# to staging (staging.yml) as soon as the checks of what staging runs pass.

name: main

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # The services from compose.yaml, with CI's in-memory database on top.
  COMPOSE_FILE: compose.yaml:.github/compose.ci.yaml

jobs:
  # Each check is its own job, so they run side by side and each shows its
  # own result (.github/actions/check runs one). The Go tests run once, as
  # the cloud runs: the cloud build as the application role, split eight
  # ways by package (scripts/test-shard.ts). A public repository runs at
  # most 20 jobs at once; a run uses 19, and its staging release one more.
  #
  # Go's build cache is kept per kind of build, not per job, so the caches
  # of a run fit under GitHub's 10 GB together and none is evicted by its
  # siblings. One job of each kind saves it, after compiling what the
  # others need.
  #
  # These checks gate the staging release.
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: lint go, run: make lint-go GOLANGCI_LINT=./bin/golangci-lint, cache: lint, save: true, golangci: true }
          - { name: browser app and infrastructure, run: make lint-web test-web infra-check, cache: infra, save: true, install: true }
          - { name: go tests (1/8), run: make test-cloud SHARD=1/8, cache: cloud, save: true, warm: go build -race -tags cloud ./... && make warm-arch, services: true }
          - { name: go tests (2/8), run: make test-cloud SHARD=2/8, cache: cloud, services: true }
          - { name: go tests (3/8), run: make test-cloud SHARD=3/8, cache: cloud, services: true }
          - { name: go tests (4/8), run: make test-cloud SHARD=4/8, cache: cloud, services: true }
          - { name: go tests (5/8), run: make test-cloud SHARD=5/8, cache: cloud, services: true }
          - { name: go tests (6/8), run: make test-cloud SHARD=6/8, cache: cloud, services: true }
          - { name: go tests (7/8), run: make test-cloud SHARD=7/8, cache: cloud, services: true }
          - { name: go tests (8/8), run: make test-cloud SHARD=8/8, cache: cloud, services: true }
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/check
        with:
          run: ${{ matrix.run }}
          cache: ${{ matrix.cache }}
          save: ${{ matrix.save }}
          warm: ${{ matrix.warm }}
          services: ${{ matrix.services }}
          install: ${{ matrix.install }}
          golangci: ${{ matrix.golangci }}

  # Checks of what staging never runs: the self-hosted build, on the
  # packages that differ between the editions, and the timing and dev build
  # tests. They run alongside and fail main's run, but the release does not
  # wait for them.
  self-hosted:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: go tests in the self-hosted edition, run: make test-self-host, cache: race, save: true, services: true }
          - { name: timing and dev build tests, run: make test-timing test-dev, cache: misc, save: true, services: true }
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/check
        with:
          run: ${{ matrix.run }}
          cache: ${{ matrix.cache }}
          save: ${{ matrix.save }}
          services: ${{ matrix.services }}

  e2e:
    name: e2e (${{ matrix.shard }}/6)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v5
      - name: Start services
        run: (docker compose up -d --wait > "$RUNNER_TEMP/services.log" 2>&1; echo $? > "$RUNNER_TEMP/services.status") &
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          name: e2e
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The runner image already carries Chrome's system libraries, so only
      # the browser itself is installed, never anything through apt.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install chromium
      - name: Wait for services
        run: .github/wait-for-services.sh
      - id: check
        run: make e2e E2E_ARGS=--shard=${{ matrix.shard }}/6
      - if: ${{ failure() && steps.check.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
      - if: ${{ !cancelled() && matrix.shard == 1 && steps.check.outcome != 'skipped' }}
        uses: ./.github/actions/go-cache
        with:
          name: e2e
          mode: save

  # The release image, built while the checks run. The binary is compiled
  # here with the end-to-end jobs' warm build cache and only packed by
  # Docker. Pushes to main push it under the commit's sha; staging.yml
  # releases it once this whole run has passed.
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          name: e2e
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Build the cloud binary
        run: |
          mkdir -p "$RUNNER_TEMP/image"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -tags cloud -ldflags="-s -w" -o "$RUNNER_TEMP/image/dimmi" ./cmd/dimmi
      - uses: docker/setup-buildx-action@v3
      - if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            BINARY=prebuilt
            REVISION=${{ github.sha }}
          build-contexts: prebuilt=${{ runner.temp }}/image
          push: ${{ env.PUSH == 'true' }}
          tags: ghcr.io/dimmihq/dimmi:${{ github.sha }}

  staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, e2e, image]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/staging.yml
    secrets: inherit
