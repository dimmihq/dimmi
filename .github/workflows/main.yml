# Every push to main: check everything, build the cloud image once, release it
# to staging and smoke test it there. Production takes this exact image later,
# by hand, through the production workflow.
#
# Staging environment settings, never in the repository: the variable
# AWS_REGION, and the secrets AWS_ACCOUNT_ID and AWS_DEPLOY_ROLE_ARN, kept
# as secrets so the public logs mask the account id.

name: main

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Each check is its own job, so they run side by side and each shows its
  # own result.
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: lint and types, target: lint, tools: true }
          - { name: go tests, target: test-go, services: true }
          - { name: go tests as the application role, target: test-app-role, services: true }
          - { name: go tests in the cloud edition, target: test-cloud, services: true }
          - { name: timing, target: test-timing, services: true }
          - { name: browser unit tests, target: test-web }
          - { name: dev build tests, target: test-dev, services: true }
          - { name: infrastructure, target: infra-check }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: matrix.tools
        run: make tools
      - if: matrix.services
        run: make services
      - run: make ${{ matrix.target }}

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: make services
      - run: make e2e

  image:
    if: github.event_name == 'push'
    needs: [check, e2e]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: false
          build-args: REVISION=${{ github.sha }}
          tags: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/dimmi-staging:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  staging:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: staging
      url: https://staging.trydimmi.com
    concurrency:
      group: release-staging
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true
      - name: Release
        run: deploy/release/release.sh "${{ github.sha }}"
        env:
          ENVIRONMENT: staging
      - name: Smoke test
        run: |
          key="$(aws secretsmanager get-secret-value --secret-id dimmi-staging/gate/ci-key --query SecretString --output text)"
          echo "::add-mask::$key"
          GATE_KEY="$key" EXPECT_RELEASE="${{ github.sha }}" deploy/release/smoke.sh https://staging.trydimmi.com expect-gate
