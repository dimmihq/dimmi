# Every push to main and every pull request: check everything, and build
# the release image alongside the checks so staging can take it the moment
# they pass (staging.yml releases only commits whose run here succeeded).

name: main

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # The services from compose.yaml, with CI's in-memory database on top.
  COMPOSE_FILE: compose.yaml:.github/compose.ci.yaml

jobs:
  # Each check is its own job, so they run side by side and each shows its
  # own result. The Go test passes are split four ways by package
  # (scripts/test-shard.ts). A public repository runs at most 20 jobs at
  # once, so the whole run stays at 20.
  #
  # Go's build cache is kept per kind of build, not per job, so the caches
  # of a run fit under GitHub's 10 GB together and none is evicted by its
  # siblings. The plain and application role passes compile the same race
  # build and share one. One job of each kind saves it.
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: lint go, run: make lint-go GOLANGCI_LINT=./bin/golangci-lint, cache: lint, save: true, golangci: true }
          - { name: browser app and infrastructure, run: make lint-web test-web infra-check, cache: infra, save: true, install: true }
          - { name: go tests (1/4), run: make test-go SHARD=1/4, cache: race, save: true, warm: go build -race ./..., services: true }
          - { name: go tests (2/4), run: make test-go SHARD=2/4, cache: race, services: true }
          - { name: go tests (3/4), run: make test-go SHARD=3/4, cache: race, services: true }
          - { name: go tests (4/4), run: make test-go SHARD=4/4, cache: race, services: true }
          - { name: go tests as the application role (1/4), run: make test-app-role SHARD=1/4, cache: race, services: true }
          - { name: go tests as the application role (2/4), run: make test-app-role SHARD=2/4, cache: race, services: true }
          - { name: go tests as the application role (3/4), run: make test-app-role SHARD=3/4, cache: race, services: true }
          - { name: go tests as the application role (4/4), run: make test-app-role SHARD=4/4, cache: race, services: true }
          - { name: go tests in the cloud edition (1/4), run: make test-cloud SHARD=1/4, cache: cloud, save: true, warm: go build -race -tags cloud ./..., services: true }
          - { name: go tests in the cloud edition (2/4), run: make test-cloud SHARD=2/4, cache: cloud, services: true }
          - { name: go tests in the cloud edition (3/4), run: make test-cloud SHARD=3/4, cache: cloud, services: true }
          - { name: go tests in the cloud edition (4/4), run: make test-cloud SHARD=4/4, cache: cloud, services: true }
          - { name: timing and dev build tests, run: make test-timing test-dev, cache: misc, save: true, services: true }
    steps:
      - uses: actions/checkout@v5
      - if: matrix.services
        name: Start services
        run: (docker compose up -d --wait > "$RUNNER_TEMP/services.log" 2>&1; echo $? > "$RUNNER_TEMP/services.status") &
      - id: go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          name: ${{ matrix.cache }}
      - if: matrix.install
        uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: ${{ matrix.install && 'pnpm' || '' }}
          package-manager-cache: ${{ matrix.install && true || false }}
      - if: matrix.install
        run: pnpm install --frozen-lockfile
      - if: matrix.golangci
        id: golangci-version
        run: echo "version=$(sed -n 's/^GOLANGCI_LINT_VERSION := //p' Makefile)" >> "$GITHUB_OUTPUT"
      - if: matrix.golangci
        id: golangci
        uses: actions/cache@v4
        with:
          path: bin/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ steps.golangci-version.outputs.version }}-go${{ steps.go.outputs.go-version }}
      - if: matrix.golangci && steps.golangci.outputs.cache-hit != 'true'
        run: make lint-tools
      - if: matrix.services
        name: Wait for services
        run: .github/wait-for-services.sh
      - id: check
        run: ${{ matrix.run }}
        env:
          GOFLAGS: -count=1 -timeout=15m
      # The job that saves a shared cache first compiles every package of
      # its kind, so the cache serves the shards that test other packages.
      - if: ${{ !cancelled() && matrix.save && matrix.warm && steps.check.outcome != 'skipped' && github.event_name != 'pull_request' }}
        name: Compile every package for the cache
        run: ${{ matrix.warm }}
      - if: ${{ !cancelled() && matrix.save && steps.check.outcome != 'skipped' }}
        uses: ./.github/actions/go-cache
        with:
          name: ${{ matrix.cache }}
          mode: save
          save-modules: ${{ matrix.golangci == true }}

  e2e:
    name: e2e (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - name: Start services
        run: (docker compose up -d --wait > "$RUNNER_TEMP/services.log" 2>&1; echo $? > "$RUNNER_TEMP/services.status") &
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          name: e2e
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The runner image already carries Chrome's system libraries, so only
      # the browser itself is installed, never anything through apt.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install chromium
      - name: Wait for services
        run: .github/wait-for-services.sh
      - id: check
        run: make e2e E2E_ARGS=--shard=${{ matrix.shard }}/4
      - if: ${{ failure() && steps.check.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
      - if: ${{ !cancelled() && matrix.shard == 1 && steps.check.outcome != 'skipped' }}
        uses: ./.github/actions/go-cache
        with:
          name: e2e
          mode: save

  # The release image, built while the checks run. The binary is compiled
  # here with the end-to-end jobs' warm build cache and only packed by
  # Docker. Pushes to main push it under the commit's sha; staging.yml
  # releases it once this whole run has passed.
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          name: e2e
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Build the cloud binary
        run: |
          mkdir -p "$RUNNER_TEMP/image"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -tags cloud -ldflags="-s -w" -o "$RUNNER_TEMP/image/dimmi" ./cmd/dimmi
      - uses: docker/setup-buildx-action@v3
      - if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            BINARY=prebuilt
            REVISION=${{ github.sha }}
          build-contexts: prebuilt=${{ runner.temp }}/image
          push: ${{ env.PUSH == 'true' }}
          tags: ghcr.io/dimmihq/dimmi:${{ github.sha }}
