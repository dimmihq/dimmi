# CI's changes to compose.yaml, picked up through COMPOSE_FILE. Every CI
# database is thrown away with the runner, so PostgreSQL keeps its data in
# memory and skips the flushes that only protect data after a crash. Tests
# make and drop a database each, which is mostly writes.
services:
  postgres:
    command: >-
      postgres -c max_connections=300 -c fsync=off -c synchronous_commit=off
      -c full_page_writes=off -c wal_level=minimal -c max_wal_senders=0
    volumes: !reset []
    tmpfs: [/var/lib/postgresql]
