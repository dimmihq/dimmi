# Local development settings. `make dev` copies this file to dimmi.yaml,
# which stays out of git; edit that copy. Services come from compose.yaml
# (`make services`).
app:
  env: local
  url: http://localhost:8080
  key_auto_generate: true
  # en-XA is the pseudo locale `make dev` generates: accented, longer
  # English that shows untranslated text and tight layouts at a glance.
  locales: [en, en-XA]
http:
  addr: 127.0.0.1:8080
  admin_addr: 127.0.0.1:9090
database:
  url: postgres://postgres:postgres@localhost:15432/dimmi?sslmode=disable
redis:
  url: redis://localhost:16379/1
migrations:
  auto: true
frontend:
  hot_path: public/hot
auth:
  signup:
    mode: open
  # Sign-in providers. A provider shows on the sign-in pages once it has a
  # client id. Register an OAuth app at each provider with the callback
  # http://localhost:8080/auth/<key>/callback, then paste its credentials.
  oauth:
    github:
      client_id: replace-with-github-client-id
      client_secret: replace-with-github-client-secret
    google:
      client_id: replace-with-google-client-id
      client_secret: replace-with-google-client-secret
mail:
  mailers:
    system:
      driver: smtp
      host: localhost
      port: 11025
      allow_insecure: true
ai:
  # Markdown articles the agent answers from until the help center's index
  # exists: a fictional product, so the agent has something to cite.
  knowledge_seed_path: database/seeders/knowledge
